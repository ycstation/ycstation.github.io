<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>

  <!-- Fallback meta refresh in case JavaScript is disabled (5 seconds) -->
  <meta http-equiv="refresh" content="5; url=https://yecheng.qzz.io/" />

  <style>
    :root {
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.03);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-light {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      filter: blur(40px);
      animation: pulse 4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* Glassmorphism Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* SVG Circular Progress */
    .progress-container {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 28px;
    }

    .progress-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .progress-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 6;
    }

    .progress-bar {
      fill: none;
      stroke: var(--primary);
      stroke-width: 6;
      stroke-linecap: round;
      /* Circumference = 2 * PI * r = 2 * 3.14159 * 58 ≈ 364.4 */
      stroke-dasharray: 364.4;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.1s linear;
      filter: drop-shadow(0 0 6px var(--primary));
    }

    .countdown-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 28px;
      word-break: break-all;
    }

    .url-preview {
      color: var(--primary);
      font-weight: 500;
    }

    /* Action Button */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="ambient-light"></div>

  <div class="card">
    <div class="progress-container">
      <svg class="progress-svg" viewBox="0 0 130 130">
        <circle class="progress-bg" cx="65" cy="65" r="58"></circle>
        <circle id="progress" class="progress-bar" cx="65" cy="65" r="58"></circle>
      </svg>
      <div id="counter" class="countdown-text">5</div>
    </div>

    <h1>Taking you there</h1>
    <p>Redirecting to <span class="url-preview" id="urlDisplay"></span></p>

    <a href="#" id="directLink" class="btn">Proceed Now &rarr;</a>
  </div>

  <script>
    // Configuration
    const TARGET_URL = "https://yecheng.qzz.io/";
    const DURATION_SECONDS = 5;

    // Element references
    const counterEl = document.getElementById("counter");
    const progressEl = document.getElementById("progress");
    const directLink = document.getElementById("directLink");
    const urlDisplay = document.getElementById("urlDisplay");

    // Populate links & preview text
    directLink.href = TARGET_URL;
    try {
      urlDisplay.textContent = new URL(TARGET_URL).hostname;
    } catch {
      urlDisplay.textContent = TARGET_URL;
    }

    // Circular progress math (circumference = 2 * PI * 58)
    const TOTAL_OFFSET = 2 * Math.PI * 58;
    progressEl.style.strokeDasharray = TOTAL_OFFSET;

    const startTime = Date.now();
    const durationMs = DURATION_SECONDS * 1000;

    function update() {
      const elapsed = Date.now() - startTime;
      const remainingMs = Math.max(0, durationMs - elapsed);
      const fraction = remainingMs / durationMs;

      // Update stroke offset to drain clockwise
      progressEl.style.strokeDashoffset = TOTAL_OFFSET * (1 - fraction);

      // Update remaining seconds display
      counterEl.textContent = Math.ceil(remainingMs / 1000);

      if (remainingMs > 0) {
        requestAnimationFrame(update);
      } else {
        window.location.href = TARGET_URL;
      }
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
